version: '3.8'

services:
  app:
    build: .
    container_name: volunteer_app
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: base64:CHANGE_ME_BASE64_OR_RUN_ARTISAN_KEY_GENERATE
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: volunteer_db
      DB_USERNAME: volunteer_user
      DB_PASSWORD: volunteer_pass
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_DRIVER: sync
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: volunteer_db
    restart: unless-stopped
    command: --log_bin_trust_function_creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: volunteer_db
      MYSQL_USER: volunteer_user
      MYSQL_PASSWORD: volunteer_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
