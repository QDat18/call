[phases.setup]
nixPkgs = ["php", "phpExtensions.gd", "phpExtensions.dom", "phpExtensions.mbstring", "phpExtensions.pdo_mysql"]

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-scripts --no-interaction"
]

[phases.start]
cmd = "php artisan serve --host 0.0.0.0 --port $PORT"
